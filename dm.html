<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6efe7">
<title>부산 카페 DM 도우미 · 최원영</title>
<style>
  :root{
    --bg:#f6efe7; --card:#fffdfa; --ink:#2c2119; --sub:#6f6156; --line:#e7dccf;
    --accent:#7a4b2a; --accent-ink:#fff; --accent-soft:#f1e2d3;
    --sent:#2f6fb0; --sent-soft:#e7f0fa; --reply:#2f7d5b; --reply-soft:#e6f4ee;
    --warn:#a8591f;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    font-size:15px; line-height:1.5;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:600px;margin:0 auto;padding:0 14px}
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
  a{color:inherit}

  /* ── sticky progress bar ── */
  .top{position:sticky;top:0;z-index:30;background:rgba(246,239,231,.94);
    -webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);padding:10px 0 9px}
  .top-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .brand{font-size:15px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .counts{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
  .counts b{color:var(--ink);font-weight:800;font-size:15px}
  .counts .rp{color:var(--reply);font-weight:800}
  .bar{height:6px;border-radius:99px;background:#e8dbcb;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#9a6a42,#7a4b2a);transition:width .35s ease}
  .pace{margin:6px 0 0;font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:center}
  .pace .pill{padding:2px 8px;border-radius:99px;background:#ece1d4;font-weight:700;color:#6a5442;font-variant-numeric:tabular-nums}
  .pace .pill.warn{background:#fbe7d5;color:var(--warn)}
  .pace .pill.over{background:#fadbd8;color:#a12f22}

  /* ── blocks ── */
  section{margin-top:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
  .panel h2{font-size:12px;margin:0 0 8px;color:var(--sub);font-weight:800;letter-spacing:.04em}

  .seg{display:flex;background:#efe5d9;border-radius:12px;padding:3px;gap:3px}
  .seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:700;
    font-size:13.5px;color:#7a6a5b;transition:.15s}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(80,50,20,.14)}

  details.editor{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
  details.editor summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent);list-style:none}
  details.editor summary::-webkit-details-marker{display:none}
  details.editor summary::before{content:"✎ "}
  details.editor label{display:block;margin-top:10px;font-size:12px;font-weight:800;color:var(--sub)}
  details.editor textarea{width:100%;margin-top:5px;min-height:120px;resize:vertical;
    border:1px solid var(--line);border-radius:10px;padding:10px;background:#fffdf9;color:var(--ink);
    font-family:inherit;font-size:12.5px;line-height:1.55}
  details.editor textarea:focus{outline:2px solid var(--accent-soft);border-color:#cbb49c}
  .editor-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
  .tiny{font-size:11.5px;color:var(--sub);line-height:1.45}
  .tiny code{background:#efe5d9;border-radius:5px;padding:1px 5px;font-size:11px;font-family:inherit;font-weight:700}

  .search{position:relative}
  .search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;
    padding:11px 38px 11px 13px;font-size:15px;font-family:inherit;color:var(--ink)}
  .search input:focus{outline:2px solid var(--accent-soft);border-color:#cbb49c}
  .search input::-webkit-search-cancel-button{-webkit-appearance:none}
  .search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:#efe5d9;
    width:26px;height:26px;border-radius:50%;font-size:14px;line-height:1;display:none;align-items:center;justify-content:center;color:#7a6a5b}
  .search.has .clear{display:flex}

  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:99px;
    padding:7px 11px;font-size:12.5px;font-weight:700;color:#6a5a4c;white-space:nowrap}
  .chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .chips button .n{opacity:.6;font-weight:600;margin-left:3px;font-variant-numeric:tabular-nums}

  .shown{margin:10px 2px 0;font-size:12.5px;color:var(--sub);display:flex;justify-content:space-between;gap:8px}
  .shown button{border:0;background:none;color:var(--accent);font-weight:700;font-size:12.5px;padding:0}

  /* ── card ── */
  .list{display:flex;flex-direction:column;gap:9px;margin-top:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 11px;
    border-left:4px solid #e2d5c7;transition:border-color .2s}
  .card[data-status="sent"]{border-left-color:var(--sent)}
  .card[data-status="replied"]{border-left-color:var(--reply)}
  .card.hide{display:none}
  .c-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .c-name{font-size:16.5px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.3;word-break:keep-all}
  .c-name .no{font-size:11px;font-weight:700;color:#b6a390;margin-right:4px;font-variant-numeric:tabular-nums}
  .badge{flex:0 0 auto;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;
    background:#efe5d9;color:#7a6a5b;margin-top:1px}
  .card[data-status="sent"] .badge{background:var(--sent-soft);color:var(--sent)}
  .card[data-status="replied"] .badge{background:var(--reply-soft);color:var(--reply)}
  .c-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;font-size:12.5px;color:var(--sub)}
  .area-tag{background:var(--accent-soft);color:#7a4b2a;font-weight:700;border-radius:6px;padding:1px 6px;font-size:11.5px}
  .handle{font-weight:600;color:#5c4a3b}
  .c-meta a.tel{color:var(--sub);text-decoration:none;border-bottom:1px dotted #c9b9a8}

  .msg{margin:9px 0 0;padding:11px 12px;border-radius:11px;background:#fbf6f0;border:1px dashed #e3d6c8;
    font-family:inherit;font-size:13px;line-height:1.68;white-space:pre-wrap;word-break:keep-all;
    overflow-wrap:anywhere;color:#4a3b2f;display:none}
  .msg.open{display:block}
  .msg .lnk{color:var(--accent);font-weight:700}

  .acts{display:flex;gap:7px;margin-top:10px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 10px;font-weight:800;
    font-size:14px;display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;
    transition:transform .08s,background .15s}
  .btn:active{transform:scale(.98)}
  .btn.primary{flex:1.35;background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{flex:1;background:#fff;color:#5c4a3b}

  .toggles{display:flex;gap:6px;margin-top:7px;align-items:center}
  .tg{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:700;color:#7a6a5b}
  .tg::before{content:"○ ";font-size:11px}
  .tg[aria-pressed="true"]{background:var(--sent-soft);border-color:#b7d2ea;color:var(--sent)}
  .tg[aria-pressed="true"]::before{content:"● "}
  .tg.reply[aria-pressed="true"]{background:var(--reply-soft);border-color:#aed9c6;color:var(--reply)}
  .tg-view{margin-left:auto;border:0;background:none;color:#9c8875;font-size:12px;font-weight:700;padding:6px 2px}

  .empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:14px}

  .foot{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .foot .btn{padding:12px 8px;font-size:13.5px;border-radius:12px}
  .foot .btn.danger{color:#a12f22;border-color:#eccfc9;background:#fff8f7}
  .notice{margin-top:16px;font-size:11.5px;line-height:1.6;color:#8a7a6b;background:#f1e8dd;
    border-radius:12px;padding:10px 12px}
  .notice b{color:#6a5442}

  /* ── toast ── */
  #toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,24px);
    background:#2c2119;color:#fff;border-radius:13px;padding:11px 14px;font-size:13.5px;font-weight:700;
    display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(44,33,25,.28);
    opacity:0;pointer-events:none;transition:.22s ease;z-index:60;max-width:calc(100% - 28px)}
  #toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #toast button{border:0;background:rgba(255,255,255,.16);color:#fff;font-weight:800;font-size:12.5px;
    padding:5px 9px;border-radius:8px;white-space:nowrap}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand"><span class="dot"></span>부산 카페 DM 도우미</div>
      <div class="counts">보냄 <b id="cSent">0</b> / <span id="cTotal">95</span> · 답장 <span class="rp" id="cReply">0</span></div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <p class="pace"><span class="pill" id="todayPill">오늘 0건</span><span id="paceText">하루 20~30건 권장</span></p>
  </div>
</div>

<div class="wrap">

  <section class="panel">
    <h2>보낼 멘트</h2>
    <div class="seg" id="toneSeg" role="group" aria-label="보낼 멘트 선택">
      <button type="button" data-tone="default" aria-pressed="true">기본 멘트</button>
      <button type="button" data-tone="short" aria-pressed="false">짧은 버전</button>
    </div>
    <p class="tiny" id="toneNote" style="margin:7px 2px 0"></p>
    <details class="editor" id="editor">
      <summary>멘트 직접 수정하기</summary>
      <label for="tplDefault">기본 멘트</label>
      <textarea id="tplDefault" spellcheck="false"></textarea>
      <label for="tplShort">짧은 버전</label>
      <textarea id="tplShort" spellcheck="false"></textarea>
      <div class="editor-foot">
        <span class="tiny"><code>{상호}</code> <code>{상권}</code> 자리에 카페 이름·상권이 자동으로 들어갑니다.</span>
        <button type="button" class="tg" id="tplReset" style="flex:0 0 auto">기본값</button>
      </div>
    </details>
  </section>

  <section>
    <div class="search" id="searchBox">
      <input id="search" type="search" placeholder="상호·인스타 아이디 검색" autocomplete="off" enterkeyhint="search">
      <button type="button" class="clear" id="searchClear" aria-label="검색어 지우기">✕</button>
    </div>
    <div class="seg" id="statusSeg" role="group" aria-label="상태 필터" style="margin-top:8px">
      <button type="button" data-status="all" aria-pressed="true">전체</button>
      <button type="button" data-status="todo" aria-pressed="false">미발송</button>
      <button type="button" data-status="sent" aria-pressed="false">보냄</button>
      <button type="button" data-status="replied" aria-pressed="false">답장옴</button>
    </div>
    <div class="chips" id="areaChips"></div>
  </section>

  <p class="shown"><span id="shownText">95곳</span><button type="button" id="collapseAll">멘트 모두 접기</button></p>

  <div class="list" id="list"></div>

  <div class="foot">
    <button type="button" class="btn" id="exportBtn">진행 상태 내보내기</button>
    <button type="button" class="btn danger" id="resetBtn">기록 초기화</button>
  </div>

  <p class="notice">
    <b>보내기 전에</b> 계정의 최근 게시물로 영업 중인지·상호가 맞는지 한 번만 확인하세요.
    같은 문구를 짧은 시간에 반복 발송하면 인스타그램이 스팸으로 볼 수 있어 <b>하루 20~30건</b>이 안전합니다.
    서로 팔로우 상태가 아니면 DM이 ‘요청’함으로 들어가 알림이 가지 않을 수 있습니다.
  </p>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  var CAFES = JSON.parse(document.getElementById('cafe-data').textContent);
  var TOTAL = CAFES.length;
  var KEY = 'busan-cafe-dm-v1';
  var LINK = 'https://wonyoung101.github.io/cafe-order-prices/';
  var DAILY_MIN = 20, DAILY_MAX = 30;

  var DEFAULT_TPL = {
    default: `안녕하세요 사장님. 부산에서 ai와 sns를 다루는 채널인 '백수로 살아남기'입니다. 갑작스러운 연락 드려 죄송합니다.

다름이 아니라 제가 카페 사장님들 대상으로 카페에서 자주 사용하시는 재료들의 가격 변동을 알려주는 사이트를 만들었어요. 괜찮으시다면 무료로 써보시고 피드백을 한번 요청드리고 싶어서 연락드렸어요.

✅️ 사이트의 장점
👉 쿠팡 로켓배송 상품만 취급(당일 배송 가능)
👉 개당·100g당·100ml당 단가 표시(원단위 확인 가능)
👉 매일 4회 각 상품의 가격 변동 확인
👉 당일, 최근 30일간 가격 변동 그래프 확인 가능
👉 현재 제품 200개 정도 반영 (3~4일 내 1200개까지 반영 예정)
👉 최종적으로 원가 절감 가능

아직 품목이 많지 않아 부족한 점이 많은데, 현장에서 발주하시는 입장에서 "이런 품목이 있었으면 좋겠다", "이 계산 방식이 헷갈린다" 같은 의견을 한두 줄만 주시면 큰 도움이 됩니다.

바쁘신 중에 답장을 강요드리는 건 아니고, 시간 되실 때 한 번만 봐주셔도 충분합니다. 관심 있으시다면 사이트 링크 한번 보내드리도록 하겠습니다!!`,
    short: `안녕하세요 {상호} 사장님, 갑자기 DM 드려 죄송합니다.
부산 카페 발주 단가를 정리하다가 답답해서, 쿠팡 로켓배송 기준으로 원두·우유·컵·시럽 같은 품목의 개당 단가를 자동 계산해 보여주는 사이트를 만들어 운영하고 있어요.
${LINK}
발주 전에 가격만 훑어보시는 용도로 편하게 보셔도 되고, 보시다가 "이 품목은 왜 없냐" 같은 한마디만 주셔도 다음 업데이트에 반영하겠습니다. 감사합니다!`
  };
  var TONE_NOTE = {
    default: '링크 없이 보내고, 관심 있다고 답한 곳에만 링크를 보내는 버전이에요.',
    short: '사이트 링크까지 바로 넣어 보내는 짧은 버전이에요. {상호} 자리에 상호가 들어갑니다.'
  };

  var AREA_ALIAS = { '전포·동성로':'전포·동성로' };

  /* ── state ── */
  var state = { tone:'default', sent:{}, replied:{}, tpl:{ default:null, short:null } };
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return;
      var s = JSON.parse(raw);
      if(!s || typeof s!=='object') return;
      if(s.tone==='short'||s.tone==='default') state.tone = s.tone;
      if(s.sent && typeof s.sent==='object') state.sent = s.sent;
      if(s.replied && typeof s.replied==='object') state.replied = s.replied;
      if(s.tpl && typeof s.tpl==='object'){
        state.tpl.default = typeof s.tpl.default==='string' ? s.tpl.default : null;
        state.tpl.short = typeof s.tpl.short==='string' ? s.tpl.short : null;
      }
    }catch(e){ /* private mode / corrupt */ }
  }
  var saveTimer = null;
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ /* storage full or blocked */ }
  }
  function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 120); }

  /* ── helpers ── */
  function tpl(tone){
    var t = state.tpl[tone];
    return (typeof t==='string' && t.trim()) ? t : (DEFAULT_TPL[tone] || DEFAULT_TPL.default);
  }
  function msgFor(cafe){
    return tpl(state.tone)
      .replace(/\{상호\}/g, cafe.name)
      .replace(/\{상권\}/g, AREA_ALIAS[cafe.area] || cafe.area);
  }
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function todayKey(d){
    d = d || new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function statusOf(cafe){
    if(state.replied[cafe.no]) return 'replied';
    if(state.sent[cafe.no]) return 'sent';
    return 'todo';
  }
  function isToday(v){
    if(!v) return false;
    return String(v).slice(0,10) === todayKey();
  }

  /* ── elements ── */
  var $ = function(id){ return document.getElementById(id); };
  var listEl = $('list'), chipsEl = $('areaChips'), toastEl = $('toast');
  var searchEl = $('search'), searchBox = $('searchBox');

  /* ── area chips ── */
  var areas = (function(){
    var map = {};
    CAFES.forEach(function(c){ map[c.area] = (map[c.area]||0)+1; });
    return Object.keys(map).map(function(a){ return { name:a, n:map[a] }; })
      .sort(function(x,y){ return y.n-x.n || x.name.localeCompare(y.name,'ko'); });
  })();

  var filter = { q:'', status:'all', area:'all' };

  (function renderChips(){
    var html = '<button type="button" data-area="all" class="on" aria-pressed="true">전체<span class="n">'+TOTAL+'</span></button>';
    areas.forEach(function(a){
      html += '<button type="button" data-area="'+esc(a.name)+'" aria-pressed="false">'+esc(a.name)+'<span class="n">'+a.n+'</span></button>';
    });
    chipsEl.innerHTML = html;
  })();

  /* ── cards ── */
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(m){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];
    });
  }

  function cardHTML(c){
    var st = statusOf(c);
    var badge = st==='replied' ? '답장옴' : (st==='sent' ? '보냄' : '미발송');
    var phone = c.phone ? '<a class="tel" href="tel:'+esc(c.phone.replace(/[^0-9+]/g,''))+'">'+esc(c.phone)+'</a>' : '<span style="color:#b6a390">번호 없음</span>';
    return ''+
    '<article class="card" data-no="'+c.no+'" data-status="'+st+'" data-area="'+esc(c.area)+'" data-search="'+esc((c.name+' '+c.handle+' '+c.area).toLowerCase())+'">'+
      '<div class="c-head">'+
        '<h3 class="c-name"><span class="no">'+pad(c.no)+'</span>'+esc(c.name)+'</h3>'+
        '<span class="badge">'+badge+'</span>'+
      '</div>'+
      '<div class="c-meta"><span class="area-tag">'+esc(c.area)+'</span><span class="handle">@'+esc(c.handle)+'</span>'+phone+'</div>'+
      '<pre class="msg" data-msg="'+c.no+'"></pre>'+
      '<div class="acts">'+
        '<button type="button" class="btn primary" data-act="copy">멘트 복사</button>'+
        '<a class="btn ghost" href="'+esc(c.insta)+'" target="_blank" rel="noopener noreferrer">인스타 열기 ↗</a>'+
      '</div>'+
      '<div class="toggles">'+
        '<button type="button" class="tg" data-act="sent" aria-pressed="'+(!!state.sent[c.no])+'">보냄</button>'+
        '<button type="button" class="tg reply" data-act="replied" aria-pressed="'+(!!state.replied[c.no])+'">답장옴</button>'+
        '<button type="button" class="tg-view" data-act="view">멘트 보기</button>'+
      '</div>'+
    '</article>';
  }

  $('cTotal').textContent = TOTAL;
  listEl.innerHTML = CAFES.map(cardHTML).join('');

  var cards = Array.prototype.slice.call(listEl.querySelectorAll('.card'));
  var byNo = {};
  cards.forEach(function(el){ byNo[el.getAttribute('data-no')] = el; });

  /* ── messages ── */
  function paintMessages(){
    cards.forEach(function(el){
      var no = el.getAttribute('data-no');
      var cafe = CAFES.filter(function(c){ return String(c.no)===no; })[0];
      var pre = el.querySelector('.msg');
      pre.textContent = msgFor(cafe);
      el.querySelector('[data-act="copy"]').setAttribute('data-ready','1');
    });
  }

  /* ── progress ── */
  function paintProgress(){
    var sentN = 0, replyN = 0, todayN = 0;
    CAFES.forEach(function(c){
      if(state.sent[c.no]){ sentN++; if(isToday(state.sent[c.no])) todayN++; }
      if(state.replied[c.no]) replyN++;
    });
    $('cSent').textContent = sentN;
    $('cReply').textContent = replyN;
    $('barFill').style.width = (TOTAL ? (sentN/TOTAL*100) : 0).toFixed(1)+'%';

    var pill = $('todayPill'), txt = $('paceText');
    pill.textContent = '오늘 '+todayN+'건';
    pill.className = 'pill' + (todayN>DAILY_MAX ? ' over' : (todayN>=DAILY_MIN ? ' warn' : ''));
    if(todayN>DAILY_MAX) txt.textContent = '오늘은 충분해요. 내일 이어서 하세요.';
    else if(todayN>=DAILY_MIN) txt.textContent = '권장량(20~30건) 근처예요.';
    else txt.textContent = '하루 20~30건 권장 · '+(DAILY_MAX-todayN)+'건 더 가능';
  }

  function paintCard(el){
    var no = el.getAttribute('data-no');
    var cafe = CAFES.filter(function(c){ return String(c.no)===no; })[0];
    var st = statusOf(cafe);
    el.setAttribute('data-status', st);
    el.querySelector('.badge').textContent = st==='replied' ? '답장옴' : (st==='sent' ? '보냄' : '미발송');
    var sBtn = el.querySelector('[data-act="sent"]');
    var rBtn = el.querySelector('[data-act="replied"]');
    sBtn.setAttribute('aria-pressed', String(!!state.sent[no]));
    rBtn.setAttribute('aria-pressed', String(!!state.replied[no]));
    return st;
  }

  /* ── filtering ── */
  function applyFilters(){
    var q = filter.q.trim().toLowerCase();
    var shown = 0;
    cards.forEach(function(el){
      var okQ = !q || el.getAttribute('data-search').indexOf(q) > -1 || el.getAttribute('data-no') === q.replace(/^0+/,'');
      var okA = filter.area==='all' || el.getAttribute('data-area')===filter.area;
      var okS = filter.status==='all' || el.getAttribute('data-status')===filter.status;
      var ok = okQ && okA && okS;
      el.classList.toggle('hide', !ok);
      if(ok) shown++;
    });
    var label = shown===TOTAL ? TOTAL+'곳 전체' : shown+'곳 표시 / '+TOTAL+'곳';
    if(filter.area!=='all') label += ' · '+filter.area;
    $('shownText').textContent = label;
    var list = listEl;
    var empty = document.getElementById('emptyMsg');
    if(!shown){
      if(!empty){
        empty = document.createElement('div');
        empty.id = 'emptyMsg';
        empty.className = 'empty';
        empty.textContent = '조건에 맞는 카페가 없어요.';
        list.appendChild(empty);
      }
    } else if(empty){ empty.remove(); }
  }

  /* ── toast ── */
  var toastTimer = null;
  function toast(text, actionLabel, actionFn){
    toastEl.innerHTML = '';
    var span = document.createElement('span');
    span.textContent = text;
    toastEl.appendChild(span);
    if(actionLabel){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = actionLabel;
      b.addEventListener('click', function(){ hideToast(); actionFn && actionFn(); });
      toastEl.appendChild(b);
    }
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, actionLabel ? 5200 : 1900);
  }
  function hideToast(){ toastEl.classList.remove('show'); }

  /* ── copy ── */
  function copyText(text){
    if(navigator.clipboard && window.isSecureContext){
      return navigator.clipboard.writeText(text).then(function(){ return true; })
        .catch(function(){ return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }
  function legacyCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    var ok = false;
    try{
      ta.select();
      ta.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
    }catch(e){ ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  /* ── actions ── */
  listEl.addEventListener('click', function(ev){
    var btn = ev.target.closest('button');
    if(!btn) return;
    var card = btn.closest('.card');
    if(!card) return;
    var no = card.getAttribute('data-no');
    var cafe = CAFES.filter(function(c){ return String(c.no)===no; })[0];
    var act = btn.getAttribute('data-act');

    if(act==='view'){
      var pre = card.querySelector('.msg');
      var open = pre.classList.toggle('open');
      btn.textContent = open ? '멘트 접기' : '멘트 보기';
      return;
    }

    if(act==='copy'){
      var text = msgFor(cafe);
      copyText(text).then(function(ok){
        if(!ok){
          card.querySelector('.msg').classList.add('open');
          btn.textContent = '멘트 접기';
          toast('자동 복사가 안 됐어요. 길게 눌러 복사하세요');
          return;
        }
        var wasSent = state.sent[no];
        var prevStamp = wasSent;
        if(!wasSent){
          state.sent[no] = new Date().toISOString();
          saveSoon();
          paintCard(card);
          paintProgress();
          applyFilters();
        }
        toast('복사됨! 인스타에 붙여넣으세요', wasSent ? null : '되돌리기', function(){
          if(!prevStamp){
            delete state.sent[no];
            saveSoon();
            paintCard(card);
            paintProgress();
            applyFilters();
            toast('보냄 표시를 되돌렸어요');
          }
        });
      });
      return;
    }

    if(act==='sent'){
      if(state.sent[no]) delete state.sent[no];
      else state.sent[no] = new Date().toISOString();
      if(!state.sent[no] && state.replied[no]) { /* replied 유지 */ }
      saveSoon();
      paintCard(card); paintProgress(); applyFilters();
      return;
    }

    if(act==='replied'){
      if(state.replied[no]){
        delete state.replied[no];
      }else{
        state.replied[no] = new Date().toISOString();
        if(!state.sent[no]) state.sent[no] = state.replied[no];
      }
      saveSoon();
      paintCard(card); paintProgress(); applyFilters();
      return;
    }
  });

  /* ── tone ── */
  $('toneSeg').addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-tone]');
    if(!b) return;
    state.tone = b.getAttribute('data-tone');
    save();
    paintTone();
    paintMessages();
    // 접혀 있던 미리보기는 새 톤으로 다시 그대로 둔다
  });
  function paintTone(){
    Array.prototype.forEach.call($('toneSeg').children, function(b){
      var on = b.getAttribute('data-tone')===state.tone;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
    $('toneNote').textContent = TONE_NOTE[state.tone] || '';
  }

  /* ── template editor ── */
  var taDefault = $('tplDefault'), taShort = $('tplShort');
  function fillEditor(){
    taDefault.value = tpl('default');
    taShort.value = tpl('short');
  }
  function onEdit(){
    state.tpl.default = taDefault.value === DEFAULT_TPL.default ? null : taDefault.value;
    state.tpl.short = taShort.value === DEFAULT_TPL.short ? null : taShort.value;
    saveSoon();
    paintMessages();
  }
  taDefault.addEventListener('input', onEdit);
  taShort.addEventListener('input', onEdit);
  $('tplReset').addEventListener('click', function(){
    state.tpl.default = null; state.tpl.short = null;
    save();
    fillEditor();
    paintMessages();
    toast('기본 멘트로 되돌렸어요');
  });

  /* ── search ── */
  searchEl.addEventListener('input', function(){
    filter.q = searchEl.value;
    searchBox.classList.toggle('has', !!searchEl.value);
    applyFilters();
  });
  $('searchClear').addEventListener('click', function(){
    searchEl.value = '';
    filter.q = '';
    searchBox.classList.remove('has');
    applyFilters();
    searchEl.focus();
  });

  /* ── status seg ── */
  $('statusSeg').addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-status]');
    if(!b) return;
    filter.status = b.getAttribute('data-status');
    Array.prototype.forEach.call($('statusSeg').children, function(x){
      var on = x===b;
      x.classList.toggle('on', on);
      x.setAttribute('aria-pressed', String(on));
    });
    applyFilters();
  });

  /* ── area chips ── */
  chipsEl.addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-area]');
    if(!b) return;
    filter.area = b.getAttribute('data-area');
    Array.prototype.forEach.call(chipsEl.children, function(x){
      var on = x===b;
      x.classList.toggle('on', on);
      x.setAttribute('aria-pressed', String(on));
    });
    applyFilters();
    window.scrollTo({ top: Math.max(0, chipsEl.getBoundingClientRect().top + window.scrollY - 118), behavior:'smooth' });
    b.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
  });

  /* ── collapse all ── */
  $('collapseAll').addEventListener('click', function(){
    var anyOpen = cards.some(function(el){ return el.querySelector('.msg').classList.contains('open'); });
    cards.forEach(function(el){
      el.querySelector('.msg').classList.toggle('open', false);
      el.querySelector('[data-act="view"]').textContent = '멘트 보기';
    });
    if(!anyOpen){ toast('멘트를 모두 접었어요'); }
    this.textContent = '멘트 모두 접기';
  });

  /* ── export / reset ── */
  $('exportBtn').addEventListener('click', function(){
    var items = CAFES.map(function(c){
      return {
        no:c.no, name:c.name, area:c.area, handle:c.handle,
        status: statusOf(c),
        sentAt: state.sent[c.no] || null,
        repliedAt: state.replied[c.no] || null
      };
    });
    var sentN = items.filter(function(i){ return i.sentAt; }).length;
    var replyN = items.filter(function(i){ return i.repliedAt; }).length;
    var data = {
      exportedAt: new Date().toISOString(),
      total: TOTAL, sent: sentN, replied: replyN,
      tone: state.tone, items: items
    };
    var name = 'busan-dm-progress-'+todayKey()+'.json';
    var blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    toast('진행 상태를 '+name+' 로 저장했어요');
  });

  $('resetBtn').addEventListener('click', function(){
    if(!window.confirm('보냄·답장 기록을 모두 지울까요?\n(멘트 수정 내용은 그대로 남습니다. 되돌릴 수 없어요.)')) return;
    state.sent = {}; state.replied = {};
    save();
    cards.forEach(paintCard);
    paintProgress();
    applyFilters();
    toast('기록을 초기화했어요');
  });

  /* ── boot ── */
  load();
  paintTone();
  fillEditor();
  paintMessages();
  paintProgress();
  cards.forEach(paintCard);
  applyFilters();
  window.scrollTo(0,0);
})();
</script>
</body>
</html>
