name: 카페 단가표 자동 갱신

# push 트리거는 두지 않습니다(코드 수정만으로 API를 호출하지 않도록).
on:
  schedule:
    # 매일 07:00 KST (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-deals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1차 안전장치: 2026-11-16 00:05 KST 이전이면 수집 스텝 자체를 실행하지 않습니다.
      - name: 쿨다운 안전장치
        id: gate
        run: |
          SKIP=$(python -c "from datetime import datetime, timezone; u=datetime(2026,11,15,15,5,tzinfo=timezone.utc); print('true' if datetime.now(timezone.utc) < u else 'false')")
          echo "cooldown_skip=$SKIP"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      # 2차 안전장치: 스크립트 내부에서도 같은 시각 이전이면 네트워크 요청 없이 종료합니다.
      - name: 단가표 수집
        if: steps.gate.outputs.skip != 'true'
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python scripts/fetch_cafe_deals.py

      - name: 변경분 커밋
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ -z "$(git status --porcelain deals.json)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deals.json
          git commit -m "chore: 카페 단가표 자동 갱신 ($(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST'))"
          git push
